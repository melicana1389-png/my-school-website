<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>مدرسه ما</title>
    <style>
        body {
            background: linear-gradient(to bottom right, #0078d7, #00c6ff);
            font-family: 'Vazir', sans-serif;
            color: white;
            text-align: center;
            padding: 50px;
        }
        h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }
        p {
            font-size: 22px;
        }
        button {
            background: white;
            color: #0078d7;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 30px;
        }
        button:hover {
            background: #e0e0e0;
        }
    </style>
</head>
<body>
    <h1>🎓 به سایت مدرسه ما خوش آمدید!</h1>
    <p>اینجا جاییه برای معرفی فعالیت‌های علمی، فرهنگی و ورزشی مدرسه‌مون.</p>
    <button onclick="showMessage()">بزن روی من 😄</button>

    <script>
        function showMessage() {
            alert("موفق باشی! 🌟 از طرف انجمن علمی مدرسه 🚀");
        }
    </script>
</body>
</html>
